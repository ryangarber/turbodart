name: turbodart
description: >-
  A workspace task runner for Dart pub workspaces, modeled on Turborepo: run
  scripts across packages in dependency order and cache their results.
version: 0.1.0
topics: [workspace, monorepo, build, cache, cli]

environment:
  sdk: ^3.10.0

executables:
  turbodart:

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

turbodart:
  tasks:
    format:
      run: dart format --output=none --set-exit-if-changed .
    analyze:
      run: dart analyze --fatal-infos
    test:
      run: dart test
    check:
      dependsOn: [format, analyze, test]

repository: https://github.com/ryangarber/turbodart
